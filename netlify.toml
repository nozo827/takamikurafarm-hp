# Netlify のビルド設定。
# このファイルがあると、管理画面で設定しなくても Netlify が同じ条件でビルドする。

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json の engines (>=22.12.0) を満たすバージョン。
  NODE_VERSION = "22.12.0"

# --- 旧 URL の引き継ぎ -----------------------------------------------------
# 静的ページ(/about.html, /shop.html, /hurusato.html, /contact.html)は
# astro.config.mjs の build.format = 'file' により URL が変わらないため、
# リダイレクトは不要。
#
# /blog/ の WordPress は Netlify へ移行しないため失われる。
# 外部リンクや検索結果から来た人が 404 に落ちないよう、トップへ送る。
[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301
  force = true

# 竹のはなのページは移行前からサーバー上に存在せず 404 だった。
# 念のためトップへ送っておく。
[[redirects]]
  from = "/takenohana.html"
  to = "/"
  status = 301

# --- 公開前のみ有効にする設定 ----------------------------------------------
# 確認用の仮サイト(*.netlify.app)が検索結果に載らないようにする。
# 仮サイトが索引されると、本番の takamikurafarm.com と重複コンテンツとして
# 扱われるおそれがあるため、クライアント確認の間は必ず有効にしておく。
#
# ★ 本番ドメイン(takamikurafarm.com)へ切り替えるときに、この [[headers]]
#    ブロックごと削除すること。消し忘れると本番サイトが検索結果から消える。
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
